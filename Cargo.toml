[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hashimhashmi02/kinetic-engine"
authors = ["Hashim Hashmi"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# Scene dylibs and the editor are rebuilt constantly during hot reload;
# keep our own code fast to compile and dependencies fast to run.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
