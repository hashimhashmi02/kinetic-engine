[package]
name = "kinetic-core"
description = "Scene graph, animatable properties, timeline, easing and springs. No GPU, no IO."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
glam = { version = "0.34.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
proptest = "1.12.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
