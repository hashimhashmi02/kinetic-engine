name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  KINETIC_REQUIRE_FFMPEG: "1"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Render tests draw on a software Vulkan adapter (lavapipe), so they need no GPU;
      # export tests encode with ffmpeg and must not skip here.
      - name: Install lavapipe and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
